version: '3.8'

services:
  # 定义你的 FastAPI 服务
  api:
    # 构建：使用当前目录的 Dockerfile
    build: .
    # 容器名称（可选）
    container_name: fastapi-api
    # 端口映射：宿主机 8000 -> 容器 8000
    ports:
      - "8000:8000"
    # 环境变量：直接从 .env 文件读取（推荐）
    env_file:
      - .env
    # 或者直接硬编码（仅测试用，不推荐）
    # environment:
    #   - DEEPSEEK_API_KEY=sk-xxxx
    # 自动重启策略
    restart: unless-stopped
    # 网络设置（默认会创建独立网络）
    networks:
      - my-network

# 定义网络（可选，不定义也会自动创建）
networks:
  my-network:
    driver: bridge